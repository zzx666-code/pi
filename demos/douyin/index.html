<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>抖音 - 记录美好生活</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0d0d10;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;margin:0 auto;height:100dvh;background:#000;overflow:hidden;isolation:isolate}
@media(min-width:560px){
	body{display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 750px at 50% -10%,#26102c,#0d0d10 60%)}
	#app{height:min(92dvh,880px);border-radius:22px;box-shadow:0 0 0 1px #26262c,0 30px 80px rgba(0,0,0,.8),0 0 90px rgba(254,44,85,.09)}
}

#splash{position:absolute;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:splashOut .6s ease 1.4s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.splash-logo{position:relative;font-size:64px;font-weight:900;letter-spacing:6px;font-style:italic}
.splash-logo::before{content:"抖音";position:absolute;left:-3px;top:-2px;color:#25f4ee;mix-blend-mode:screen;animation:glitchA 1.1s steps(2) infinite}
.splash-logo::after{content:"抖音";position:absolute;left:3px;top:2px;color:#fe2c55;mix-blend-mode:screen;animation:glitchB 1.1s steps(2) infinite}
@keyframes glitchA{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,1px)}}
@keyframes glitchB{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-1px)}}
.splash-sub{font-size:13px;letter-spacing:8px;color:#9a9aa2}

.top-bar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px 14px 20px;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);pointer-events:none}
.tabs{display:flex;gap:26px;pointer-events:auto}
.tabs span{font-size:16px;color:rgba(255,255,255,.62);cursor:pointer;position:relative;padding:2px 2px 8px;transition:color .2s}
.tabs span.active{color:#fff;font-weight:700}
.tabs span.active::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:2px;width:22px;height:3px;border-radius:2px;background:#fff}
#searchBtn{position:absolute;right:14px;top:12px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
#searchBtn svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
#liveBadge{position:absolute;left:14px;top:12px;display:none;align-items:center;gap:4px;background:rgba(254,44,85,.9);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;pointer-events:auto;cursor:pointer}

#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.media{position:absolute;inset:0}
.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.media canvas.fake{position:absolute;inset:0;width:100%;height:100%;display:none}
.card.fakemode .media video{display:none}
.card.fakemode .media canvas.fake{display:block}
.grad-t{position:absolute;top:0;left:0;right:0;height:90px;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent);pointer-events:none;z-index:2}
.grad-b{position:absolute;bottom:0;left:0;right:0;height:190px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);pointer-events:none;z-index:2}

.progress{position:absolute;left:0;right:0;bottom:52px;height:2px;background:rgba(255,255,255,.18);z-index:6}
.progress-fill{height:100%;width:0;background:#fe2c55;border-radius:0 1px 1px 0}

.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;transition:opacity .18s;pointer-events:none}
.card.paused .play-overlay{opacity:1}
.play-overlay .pp{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;transform:scale(.85);transition:transform .18s}
.card.paused .play-overlay .pp{transform:scale(1)}
.play-overlay svg{width:34px;height:34px;fill:#fff;margin-left:4px}
.card.paused .play-overlay svg{margin-left:0}

.pill{position:absolute;left:50%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:100px;padding:7px 16px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.14)}
.mute-pill{bottom:86px}
.hint-pill{bottom:130px;pointer-events:none;animation:hintFade .5s ease 5s forwards}
@keyframes hintFade{to{opacity:0;visibility:hidden}}

.rail{position:absolute;right:8px;bottom:110px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;user-select:none}
.rail-item svg{width:36px;height:36px;fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));transition:transform .15s}
.rail-item:active svg{transform:scale(1.18)}
.btn-count{font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.avatar-wrap{position:relative;margin-bottom:6px}
.avatar{width:50px;height:50px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#4b4b52,#222);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.follow-btn{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:#fe2c55;color:#fff;font-size:14px;line-height:17px;text-align:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:all .2s}
.follow-btn.done{background:#fff;color:#fe2c55;font-size:11px;line-height:18px}
.like-btn.liked svg{fill:#fe2c55;stroke:none}
.like-btn.bump svg{animation:bump .4s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.45)}60%{transform:scale(.85)}100%{transform:scale(1)}}

.disc{position:relative;width:46px;height:46px;border-radius:50%;background:conic-gradient(from 0deg,#3a3a3a,#111,#3a3a3a,#111,#3a3a3a);display:flex;align-items:center;justify-content:center;animation:spin 6s linear infinite;animation-play-state:paused;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.card.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.disc-inner{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2c2c31,#151519);display:flex;align-items:center;justify-content:center;font-size:15px}

.info{position:absolute;left:14px;right:80px;bottom:72px;z-index:9;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.author-name{font-size:17px;font-weight:700;margin-bottom:7px;cursor:pointer}
.desc{font-size:14.5px;line-height:1.45;color:#f3f3f5;white-space:pre-wrap}
.desc .tag{color:#cfe9ff;font-weight:600}
.music-line{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:13px;color:#f3f3f5;max-width:100%}
.music-line svg{width:14px;height:14px;fill:#fff;flex:none}
.music-scroll{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.music-text{display:inline-block;white-space:nowrap;animation:marquee 9s linear infinite}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.float-heart{position:absolute;z-index:20;font-size:26px;color:#fe2c55;pointer-events:none;animation:floatUp 1.1s ease-out forwards;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
@keyframes floatUp{0%{transform:translate(0,0) scale(.5) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx,0),-38vh) scale(1.25) rotate(var(--rot,20deg));opacity:0}}
.big-heart{position:absolute;z-index:21;font-size:96px;color:#fe2c55;pointer-events:none;transform:translate(-50%,-50%);animation:bigPop .9s ease-out forwards;filter:drop-shadow(0 4px 14px rgba(254,44,85,.6))}
@keyframes bigPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}55%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.05);opacity:0}}

#nav{position:absolute;left:0;right:0;bottom:0;z-index:40;height:54px;background:#000;display:flex;align-items:center;border-top:1px solid rgba(255,255,255,.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#8a8a92;font-size:10.5px}
.nav-item svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.nav-item.active{color:#fff;font-weight:600}
.nav-plus{flex:1;display:flex;justify-content:center;cursor:pointer}
.nav-plus div{width:44px;height:30px;border-radius:9px;background:linear-gradient(90deg,#2b2b31,#fe2c55 30%,#ff5c7a 70%,#2b2b31);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(254,44,85,.4)}
.nav-plus span{color:#fff;font-size:20px;font-weight:300;line-height:1}

.sheet-backdrop{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.25s}
.sheet-backdrop.show{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#1c1c21;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.24,1);display:flex;flex-direction:column;max-height:68%}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#4a4a52;margin:8px auto 0;flex:none}
.comment-sheet{height:66%}
.sheet-header{flex:none;padding:10px 16px 12px;font-size:14px;font-weight:600;color:#e9e9ee;display:flex;justify-content:center;border-bottom:1px solid rgba(255,255,255,.06)}
.comment-list{flex:1;overflow-y:auto;padding:6px 16px 12px;scrollbar-width:none}
.comment-list::-webkit-scrollbar{display:none}
.comment-item{display:flex;gap:11px;padding:11px 0}
.c-avatar{flex:none;width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff}
.c-main{flex:1;min-width:0}
.c-name{font-size:12.5px;color:#9a9aa4;display:flex;align-items:center;gap:6px}
.c-badge{font-size:9.5px;color:#fe2c55;border:1px solid #fe2c55;border-radius:3px;padding:0 3px;font-weight:400}
.c-text{font-size:14px;line-height:1.45;color:#f0f0f3;margin-top:3px;word-break:break-word}
.c-meta{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:11.5px;color:#7c7c86}
.c-like{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:none;padding-top:6px}
.c-like svg{width:17px;height:17px;fill:#7c7c86}
.c-like.liked svg{fill:#fe2c55}
.c-like span{font-size:10.5px;color:#7c7c86}
.comment-input{flex:none;display:flex;align-items:center;gap:9px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.07)}
.comment-input input{flex:1;background:#2a2a31;border:none;border-radius:100px;padding:10px 16px;color:#fff;font-size:14px;outline:none}
.comment-input input::placeholder{color:#77777f}
.comment-input button{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:#fe2c55;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.comment-input button svg{width:17px;height:17px;fill:#fff;margin-left:2px}

.share-sheet{padding-bottom:16px}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:18px 18px 10px}
.share-item{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.share-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.share-item span{font-size:11.5px;color:#c9c9d0}
.share-cancel{margin:10px 18px 0;height:44px;border-radius:10px;background:#2a2a31;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;cursor:pointer}

#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);z-index:100;background:rgba(30,30,36,.94);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:10px 20px;font-size:13px;color:#fff;opacity:0;visibility:hidden;transition:.25s;white-space:nowrap;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
	<div id="splash">
		<div class="splash-logo">抖音</div>
		<div class="splash-sub">记录美好生活</div>
	</div>

	<div class="top-bar">
		<div class="tabs" id="tabs">
			<span data-tab="关注">关注</span>
			<span data-tab="推荐" class="active">推荐</span>
			<span data-tab="附近">附近</span>
		</div>
		<div id="searchBtn" title="搜索">
			<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
		</div>
	</div>

	<main id="feed"></main>

	<nav id="nav">
		<div class="nav-item active" data-nav="首页">
			<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
			<span>首页</span>
		</div>
		<div class="nav-item" data-nav="朋友">
			<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c.7-4 3.8-6 7.5-6s6.8 2 7.5 6"/></svg>
			<span>朋友</span>
		</div>
		<div class="nav-plus" id="navPlus"><div><span>＋</span></div></div>
		<div class="nav-item" data-nav="消息">
			<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>
			<span>消息</span>
		</div>
		<div class="nav-item" data-nav="我">
			<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1-4.3 4.3-6.2 8-6.2s7 1.9 8 6.2"/></svg>
			<span>我</span>
		</div>
	</nav>

	<div class="sheet-backdrop" id="backdrop"></div>

	<div class="sheet comment-sheet" id="commentSheet">
		<div class="sheet-handle"></div>
		<div class="sheet-header" id="commentHeader">0条评论</div>
		<div class="comment-list" id="commentList"></div>
		<div class="comment-input">
			<input id="commentInput" type="text" maxlength="120" placeholder="留下你的精彩评论吧">
			<button id="commentSend" title="发送">
				<svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2.4-7.1z"/></svg>
			</button>
		</div>
	</div>

	<div class="sheet share-sheet" id="shareSheet">
		<div class="sheet-handle"></div>
		<div class="share-grid" id="shareGrid"></div>
		<div class="share-cancel" id="shareCancel">取消</div>
	</div>

	<div id="toast"></div>
</div>

<script>

];

const C_AUTHORS = ["柠檬不酸","爱吃香菜星人","风一样的男子","momo","打工人小张","一只柯基","北纬三十度","奶茶三分糖","今天也要加油鸭","数码测评君","不吃香菜谢谢","深夜修仙中","芒果很忙","键盘侠克星","南方小土豆","热爱可抵岁月漫长"];

function seedComments(seed){
	const n = 8 + seed % 5;
	const out = [];
	for(let k = 0; k < n; k++){
		out.push({
			name: C_AUTHORS[(seed * 5 + k * 3) % C_AUTHORS.length],

	return out;
}

	{ author:"萌宠日记", emoji:"🐱", desc:"橘猫第一次见雪，反应绝了哈哈哈哈 #萌宠 #橘猫 #猫咪日常", music:"喵了个喵 - 《猫咪disco》", likes:456000, shares:32000, colors:["#134e5e","#71b280","#0b8793"] },

class FakePlayer{
	constructor(canvas, item){
		this.canvas = canvas;
		this.ctx = canvas.getContext("2d");
		this.item = item;
		this.playing = false;
		this.duration = 12;
		this.t = Math.random() * 4;
		this.last = 0;
		this.raf = 0;
		this.onProgress = null;
		this.particles = Array.from({ length: 26 }, () => ({
			x: Math.random(), y: Math.random(), r: Math.random() * 2.4 + 0.8,
			v: Math.random() * 0.02 + 0.006, ph: Math.random() * Math.PI * 2,
		}));
	}
	resize(){
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
		this.canvas.width = w * dpr;
		this.canvas.height = h * dpr;
		this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		this.w = w; this.h = h;
	}
	start(){
		if(this.playing) return;
		this.playing = true;
		this.last = performance.now();
		this.raf = requestAnimationFrame(this.tick.bind(this));
	}
	pause(){
		this.playing = false;
		cancelAnimationFrame(this.raf);
	}
	tick(now){
		if(!this.playing) return;
		const dt = Math.min((now - this.last) / 1000, 0.1);
		this.last = now;
		this.t = (this.t + dt) % this.duration;
		this.draw();
		if(this.onProgress) this.onProgress(this.t / this.duration);
		this.raf = requestAnimationFrame(this.tick.bind(this));
	}
	draw(){
		const { ctx, w, h, t } = this;
		const [c1, c2, c3] = this.item.colors;
		const a = t * 0.25;
		const g = ctx.createLinearGradient(w/2 + Math.sin(a)*w, h/2 + Math.cos(a)*h, w/2 - Math.sin(a)*w, h/2 - Math.cos(a)*h);
		g.addColorStop(0, c1); g.addColorStop(0.55, c2); g.addColorStop(1, c3);
		ctx.fillStyle = g;
		ctx.fillRect(0, 0, w, h);
		ctx.fillStyle = "rgba(255,255,255,.28)";
		for(const p of this.particles){
			const px = p.x * w + Math.sin(t + p.ph) * 12;
			const py = ((p.y - t * p.v) % 1 + 1) % 1 * h;
			ctx.beginPath();
			ctx.arc(px, py, p.r, 0, Math.PI * 2);
			ctx.fill();
		}
		const size = Math.min(w, h) * 0.3;
		ctx.save();
		ctx.translate(w / 2, h / 2 + Math.sin(t * 1.6) * 14);
		ctx.rotate(Math.sin(t * 0.8) * 0.06);
		ctx.font = size + "px serif";
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		ctx.shadowColor = "rgba(0,0,0,.4)";
		ctx.shadowBlur = 24;
		ctx.fillText(this.item.emoji, 0, 0);
		ctx.restore();
		const v = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.75);
		v.addColorStop(0, "rgba(0,0,0,0)");
		v.addColorStop(1, "rgba(0,0,0,.5)");
		ctx.fillStyle = v;
		ctx.fillRect(0, 0, w, h);
	}
}

let muted = true;
let activeIdx = 0;
const cards = [];

function buildCard(item, idx){
	const card = document.createElement("section");
	card.className = "card";
	card.innerHTML = `
		<div class="media">
			<video muted loop playsinline webkit-playsinline preload="${idx < 3 ? "auto" : "metadata"}"></video>
			<canvas class="fake"></canvas>

			${idx === 0 ? '<div class="pill hint-pill no-nav">滚动 / 方向键切换 · 双击点赞</div>' : ""}
		</div>
		<div class="progress"><div class="progress-fill"></div></div>
		<div class="rail no-nav">
			<div class="rail-item avatar-wrap-item">
				<div class="avatar-wrap">
					<div class="avatar">${item.emoji}</div>
					<div class="follow-btn">＋</div>
				</div>
			</div>
			<div class="rail-item like-btn">
				${SVG.heartO}
				<span class="btn-count like-count">${formatCount(item.likes)}</span>
			</div>
			<div class="rail-item comment-btn">
				${SVG.comment}
				<span class="btn-count comment-count">${item.comments.length}</span>
			</div>
			<div class="rail-item share-btn">
				${SVG.share}
				<span class="btn-count">${formatCount(item.shares)}</span>
			</div>
			<div class="rail-item disc-item">
				<div class="disc"><div class="disc-inner">${item.emoji}</div></div>
			</div>
		</div>
		<div class="info no-nav">
			<div class="author-name">@${item.author}</div>
			<div class="desc">${highlight(item.desc)}</div>
			<div class="music-line">${SVG.music}<span class="music-scroll"><span class="music-text">${item.music}　　${item.music}　　</span></span></div>
		</div>`;
	feed.appendChild(card);

	card._item = item;
	card._video = card.querySelector("video");
	card._fill = card.querySelector(".progress-fill");
	card._likeBtn = card.querySelector(".like-btn");
	card._likeCount = card.querySelector(".like-count");
	card._commentCount = card.querySelector(".comment-count");
	card._followBtn = card.querySelector(".follow-btn");

	const v = card._video;
	let srcIdx = 0;
	let settled = false;
	const tryNext = () => {
		if(settled) return;
		if(srcIdx >= item.urls.length){ enableFake(card); return; }
		v.src = item.urls[srcIdx++];
		v.load();
	};
	const timeout = setTimeout(tryNext, 10000);
	v.addEventListener("error", tryNext);
	v.addEventListener("loadedmetadata", () => { settled = true; clearTimeout(timeout); }, { once: true });
	v.addEventListener("timeupdate", () => {
		if(v.duration) card._fill.style.width = (v.currentTime / v.duration) * 100 + "%";
	});
	v.addEventListener("play", () => { card.classList.add("playing"); card.classList.remove("paused"); syncPauseIcon(card); });
	v.addEventListener("pause", () => { card.classList.remove("playing"); syncPauseIcon(card); });
	tryNext();
	return card;
}

function enableFake(card){
	if(card._fake) return;
	card.classList.add("fakemode");
	card._fake = new FakePlayer(card.querySelector("canvas.fake"), card._item);
	card._fake.onProgress = (p) => { card._fill.style.width = p * 100 + "%"; };
	card._fake.playingState = false;
	if(card.classList.contains("active")) startCard(card);
}

function syncPauseIcon(card){
	const ov = card.querySelector(".play-overlay .pp");
	const playing = card.classList.contains("playing") || (!card.classList.contains("paused") && card.classList.contains("active"));
	ov.innerHTML = card.classList.contains("paused") || (!card.classList.contains("playing") && card.classList.contains("active") && !card._fakePlaying) ? SVG.play : SVG.pause;
}

function startCard(card){
	if(card._fake){
		card._fake.resize();
		card._fake.start();
		card._fakePlaying = true;
		card.classList.add("playing");
		card.classList.remove("paused");
	}else{
		card._video.muted = muted;
		card._video.play().catch(() => {});
	}
}
function stopCard(card){
	if(card._fake){
		card._fake.pause();
		card._fakePlaying = false;
	}else{
		card._video.pause();
	}
	card.classList.remove("playing");
}
function togglePlay(card){
	if(card._fake){
		if(card._fakePlaying){ card._fake.pause(); card._fakePlaying = false; card.classList.add("paused"); card.classList.remove("playing"); }
		else{ card._fake.start(); card._fakePlaying = true; card.classList.remove("paused"); card.classList.add("playing"); }
		syncPauseIcon(card);
	}else{
		if(card._video.paused) card._video.play().catch(() => {});
		else card._video.pause();
	}
}

ITEMS.forEach((item, i) => cards.push(buildCard(item, i)));

const io = new IntersectionObserver((entries) => {
	for(const en of entries){
		if(en.isIntersecting && en.intersectionRatio >= 0.55){
			const idx = cards.indexOf(en.target);
			if(idx === activeIdx) continue;
			stopCard(cards[activeIdx]);
			activeIdx = idx;
			en.target.classList.add("active");
			startCard(en.target);
			const next = cards[idx + 1];
			if(next && !next._fake && next._video.readyState === 0) next._video.load();
		}
	}
}, { root: feed, threshold: [0, 0.55] });
cards.forEach((c) => io.observe(c));
cards[0].classList.add("active");
startCard(cards[0]);

function navigate(dir){
	const idx = Math.min(Math.max(activeIdx + dir, 0), cards.length - 1);
	if(idx === activeIdx) return;
	feed.scrollTo({ top: idx * feed.clientHeight, behavior: "smooth" });
}

let wheelAcc = 0, wheelTime = 0;
feed.addEventListener("wheel", (e) => {
	if(anySheetOpen()) return;
	e.preventDefault();
	const now = performance.now();
	if(now - wheelTime > 500){ wheelAcc = 0; wheelTime = now; }
	wheelAcc += e.deltaY;
	if(Math.abs(wheelAcc) > 55){
		navigate(wheelAcc > 0 ? 1 : -1);
		wheelAcc = 0;
		wheelTime = now;
	}
}, { passive: false });

document.addEventListener("keydown", (e) => {
	if(e.key === "Escape"){ closeSheets(); return; }
	if(anySheetOpen() || e.target.tagName === "INPUT") return;
	if(e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); navigate(1); }
	else if(e.key === "ArrowUp" || e.key === "PageUp"){ e.preventDefault(); navigate(-1); }
	else if(e.key === " "){ e.preventDefault(); togglePlay(cards[activeIdx]); }
});

function spawnHearts(card, x, y){
	const big = document.createElement("div");
	big.className = "big-heart";
	big.textContent = "❤";
	big.style.left = x + "px";
	big.style.top = y + "px";
	card.appendChild(big);
	setTimeout(() => big.remove(), 950);
	for(let i = 0; i < 6; i++){
		const el = document.createElement("div");
		el.className = "float-heart";
		el.textContent = "❤";
		el.style.left = x + (Math.random() * 70 - 35) + "px";
		el.style.top = y - 10 + "px";
		el.style.setProperty("--dx", (Math.random() * 90 - 45) + "px");
		el.style.setProperty("--rot", (Math.random() * 70 - 35) + "deg");
		el.style.animationDelay = i * 0.09 + "s";
		el.style.fontSize = 16 + Math.random() * 14 + "px";
		card.appendChild(el);
		setTimeout(() => el.remove(), 1400 + i * 90);
	}
}

function setLike(card, item, liked, anim){
	if(item.liked !== liked){
		item.liked = liked;
		item.likes += liked ? 1 : -1;
	}
	card._likeBtn.classList.toggle("liked", item.liked);
	card._likeCount.textContent = formatCount(item.likes);
	if(anim && liked){
		card._likeBtn.classList.remove("bump");
		void card._likeBtn.offsetWidth;
		card._likeBtn.classList.add("bump");
	}
}

cards.forEach((card) => {
	const item = card._item;
	let clickTimer = null;
	card.addEventListener("click", (e) => {
		if(e.target.closest(".no-nav")) return;
		if(clickTimer) return;
		clickTimer = setTimeout(() => { clickTimer = null; togglePlay(card); }, 240);
	});
	card.addEventListener("dblclick", (e) => {
		if(e.target.closest(".no-nav")) return;
		clearTimeout(clickTimer);
		clickTimer = null;
		if(!item.liked) setLike(card, item, true, true);
		const rect = card.getBoundingClientRect();
		spawnHearts(card, e.clientX - rect.left, e.clientY - rect.top);
	});

	card._likeBtn.addEventListener("click", (e) => {
		e.stopPropagation();
		setLike(card, item, !item.liked, true);
	});
	card.querySelector(".comment-btn").addEventListener("click", (e) => {
		e.stopPropagation();
		openComments(card);
	});
	card.querySelector(".share-btn").addEventListener("click", (e) => {
		e.stopPropagation();
		openShare();
	});
	card._followBtn.addEventListener("click", (e) => {
		e.stopPropagation();

	const item = e.target.closest(".nav-item");
	if(item){
		if(item.dataset.nav === "首页") toast("已经是首页啦");
		else toast(item.dataset.nav + "页仅演示");
	}
});
$("#navPlus").addEventListener("click", () => toast("拍摄功能仅在手机App开放"));

document.addEventListener("visibilitychange", () => {
	const card = cards[activeIdx];
	if(document.hidden) stopCard(card);
	else if(!card.classList.contains("paused")) startCard(card);
});

window.addEventListener("resize", () => {
	const card = cards[activeIdx];
	if(card && card._fake) card._fake.resize();
});
</script>
</body>
</html>
